name = "dbd-tracker"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

[observability]
[observability.logs]
enabled = true
invocation_logs = false
destinations = ["posthog"]

[vars]
FRONTEND_URL = "http://localhost:5173"

# Realtime rooms (worker.ts `Main`, PartyServer), served by this same Worker at
# /parties/main/:room. They replaced hosted PartyKit, which shut down on 2026-10-23.
[[durable_objects.bindings]]
name = "Main"
class_name = "Main"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Main"]

[[d1_databases]]
binding = "DB"
database_name = "fila-dbd"
database_id = "local"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "local"

[env.production]
# POSTHOG_KEY is PostHog's public, write-only project token (it also ships in the web
# bundle); it keys the rooms' `fila_party_*` events (telemetry.ts).
vars = { FRONTEND_URL = "https://filadbd.pages.dev", POSTHOG_KEY = "phc_CCs7f8DwgPzVqFderx2rUX3XNS54raDHYhz8z8sxDTRW", POSTHOG_HOST = "https://us.i.posthog.com" }

[[env.production.durable_objects.bindings]]
name = "Main"
class_name = "Main"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Main"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "fila-dbd"
database_id = "0b7fe20d-bc00-4399-b58d-2923aaab201c"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "d969f51392e9471790da97ea9c053506"
